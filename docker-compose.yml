x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_HOST: ${POSTGRES_HOST:-plane-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/0}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-public-env: &public-env
  DEBUG: ${DEBUG:-0}
  SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  # 对外地址清单（逗号分隔），唯一必填的地址项；第一个作默认地址，大网 / 小网按 IP 自动认
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?请在 .env 里填 CORS_ALLOWED_ORIGINS，例如 http://10.32.232.104,http://192.168.100.104}
  # 以下地址一般留空：WEB_URL 取清单第一个，其余跟随 WEB_URL（单入口部署都是同一个地址）
  WEB_URL: ${WEB_URL:-}
  APP_BASE_URL: ${APP_BASE_URL:-}
  APP_BASE_PATH: ${APP_BASE_PATH:-}
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:-}
  ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/god-mode}
  SPACE_BASE_URL: ${SPACE_BASE_URL:-}
  SPACE_BASE_PATH: ${SPACE_BASE_PATH:-/spaces}
  # 后端调 live 转换内容（复制带图的工作项 / 页面）用，走 compose 内网
  LIVE_BASE_URL: ${LIVE_BASE_URL:-http://live:3000}
  LIVE_BASE_PATH: ${LIVE_BASE_PATH:-/live}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-change-me-live-secret}
  # 浏览器经 nginx 的 /onlyoffice/ 访问文档服务；相对路径由后端按用户访问的地址补全
  ONLYOFFICE_DOCUMENT_SERVER_URL: ${ONLYOFFICE_DOCUMENT_SERVER_URL:-/onlyoffice}
  # 后端调文档服务、文档服务拉文件 / 回调保存，都走 compose 内网，不依赖服务器对外 IP
  ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}
  ONLYOFFICE_API_BASE_URL: ${ONLYOFFICE_API_BASE_URL:-http://api:8000}
  ONLYOFFICE_JWT_ENABLED: ${ONLYOFFICE_JWT_ENABLED:-0}
  ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
  ONLYOFFICE_JWT_HEADER: ${ONLYOFFICE_JWT_HEADER:-AuthorizationJwt}
  ONLYOFFICE_SESSION_TTL_SECONDS: ${ONLYOFFICE_SESSION_TTL_SECONDS:-28800}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  USE_MINIO: ${USE_MINIO:-1}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-104857600}
  SIGNED_URL_EXPIRATION: ${SIGNED_URL_EXPIRATION:-3600}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  JIANDAOYUN_API_BASE_URL: ${JIANDAOYUN_API_BASE_URL:-}
  JIANDAOYUN_API_TOKEN: ${JIANDAOYUN_API_TOKEN:-}
  JIANDAOYUN_APP_KEY: ${JIANDAOYUN_APP_KEY:-}
  JIANDAOYUN_PROJECT_CODE_APP_ID: ${JIANDAOYUN_PROJECT_CODE_APP_ID:-}
  JIANDAOYUN_PROJECT_CODE_ENTRY_ID: ${JIANDAOYUN_PROJECT_CODE_ENTRY_ID:-}
  JIANDAOYUN_RD_PROJECT_APP_ID: ${JIANDAOYUN_RD_PROJECT_APP_ID:-}
  JIANDAOYUN_RD_PROJECT_ENTRY_ID: ${JIANDAOYUN_RD_PROJECT_ENTRY_ID:-}
  JIANDAOYUN_PRODUCT_APP_ID: ${JIANDAOYUN_PRODUCT_APP_ID:-}
  JIANDAOYUN_PRODUCT_ENTRY_ID: ${JIANDAOYUN_PRODUCT_ENTRY_ID:-}
  JIANDAOYUN_RISK_APP_ID: ${JIANDAOYUN_RISK_APP_ID:-}
  JIANDAOYUN_RISK_ENTRY_ID: ${JIANDAOYUN_RISK_ENTRY_ID:-}
  JIANDAOYUN_API_CREATE_BASE_URL: ${JIANDAOYUN_API_CREATE_BASE_URL:-}
  JIANDAOYUN_API_UPDATE_BASE_URL: ${JIANDAOYUN_API_UPDATE_BASE_URL:-}
  JIANDAOYUN_API_DELETE_BASE_URL: ${JIANDAOYUN_API_DELETE_BASE_URL:-}
  JIANDAOYUN_RISK_PUSH_SECRET: ${JIANDAOYUN_RISK_PUSH_SECRET:-}
  JIANDAOYUN_TIMEOUT_SECONDS: ${JIANDAOYUN_TIMEOUT_SECONDS:-30}
  PERSON_INFO_API_URL: ${PERSON_INFO_API_URL:-}
  PERSON_INFO_APP_KEY: ${PERSON_INFO_APP_KEY:-}
  # 大网 / 小网隔离：按客户端 IP 判网段；只信任来自 compose 内网（nginx）的 X-Real-IP
  NETWORK_ZONE_ENABLED: ${NETWORK_ZONE_ENABLED:-0}
  NETWORK_ZONE_WAN_CIDRS: ${NETWORK_ZONE_WAN_CIDRS:-10.0.0.0/8}
  NETWORK_ZONE_LAN_CIDRS: ${NETWORK_ZONE_LAN_CIDRS:-192.168.0.0/16}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128,172.16.0.0/12}
  # 邮件链接按收件人网段选地址。一般留空：按 IP 从 CORS_ALLOWED_ORIGINS 里自动认，用域名时才手动填
  NETWORK_ZONE_WAN_WEB_URL: ${NETWORK_ZONE_WAN_WEB_URL:-}
  NETWORK_ZONE_LAN_WEB_URL: ${NETWORK_ZONE_LAN_WEB_URL:-}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

# 前端地址默认留空 = 同源相对路径：页面从哪个地址打开就请求哪个地址，
# 一套镜像大网 / 小网两个地址通用，换 IP 也不用重新构建
x-web-build-args: &web-build-args
  DOCKER_BUILDKIT: 1
  VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
  VITE_API_BASE_PATH: /api
  VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL:-}
  VITE_WEB_BASE_PATH: ${APP_BASE_PATH:-}
  VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL:-}
  VITE_ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/god-mode}
  VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL:-}
  VITE_SPACE_BASE_PATH: ${SPACE_BASE_PATH:-/spaces}
  VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL:-}
  VITE_LIVE_BASE_PATH: ${LIVE_BASE_PATH:-/live}
  # 这两个留空会回落到 plane.so，填 "/" 才是本站相对路径
  VITE_WEBSITE_URL: ${VITE_WEBSITE_URL:-/}
  VITE_DOCS_BASE_URL: ${DOCS_BASE_URL:-/}
  VITE_DOCS_BASE_PATH: ${DOCS_BASE_PATH:-/docs}
  VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@example.com}

services:
  web:
    container_name: web
    image: plane-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        <<: *web-build-args
    restart: always
    depends_on:
      api:
        condition: service_started

  admin:
    container_name: admin
    image: plane-admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        <<: *web-build-args
    restart: always
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  space:
    container_name: space
    image: plane-space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        <<: *web-build-args
    restart: always
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  migrator:
    container_name: plane-migrator
    image: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      <<: [*public-env, *db-env, *redis-env, *mq-env, *aws-s3-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy

  api:
    container_name: api
    image: plane-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    environment:
      <<: [*public-env, *db-env, *redis-env, *mq-env, *aws-s3-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  worker:
    container_name: bgworker
    image: plane-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      <<: [*public-env, *db-env, *redis-env, *mq-env, *aws-s3-env]
    depends_on:
      api:
        condition: service_started
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  beat-worker:
    container_name: beatworker
    image: plane-beat-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      <<: [*public-env, *db-env, *redis-env, *mq-env, *aws-s3-env]
    depends_on:
      api:
        condition: service_started
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  live:
    container_name: plane-live
    image: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    environment:
      PORT: 3000
      API_BASE_URL: http://api:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?请在 .env 里填 CORS_ALLOWED_ORIGINS}
      LIVE_BASE_URL: ${LIVE_BASE_URL:-}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH:-/live}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-change-me-live-secret}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      api:
        condition: service_started
      plane-redis:
        condition: service_healthy

  plane-db:
    container_name: plane-db
    image: postgres:17.11
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      <<: *db-env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:8.1-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || valkey-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "16739:6739"


  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    ports:
      - "5672:5672"
      - "15672:15672"

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    ports:
      - "19000:9000"
      - "19090:9090"

  # 文档预览 / 在线编辑；不直接对外开端口，浏览器经 proxy 的 /onlyoffice/ 访问
  onlyoffice:
    container_name: plane-onlyoffice
    image: registry.cn-hangzhou.aliyuncs.com/186184848/documentserver-ce:9.1.0
    restart: always
    environment:
      JWT_ENABLED: "false"
      # 允许从内网地址（api:8000）拉文件
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
      - onlyoffice_fonts:/usr/share/fonts/truetype/custom
      - onlyoffice_logs:/var/log/onlyoffice

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    image: plane-proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.nginx
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT:-80}:80
      - ${LISTEN_HTTPS_PORT:-443}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-104857600}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CERT_EMAIL: ${CERT_EMAIL:-}
      CERT_ACME_DNS: ${CERT_ACME_DNS:-}
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
      space:
        condition: service_started
      admin:
        condition: service_started
      live:
        condition: service_started
      docs:
        condition: service_started
      onlyoffice:
        condition: service_started
  docs:
    container_name: plane-docs
    image: plane-docs
    build:
      context: ./docs-site
      dockerfile: Dockerfile
    restart: always
  
volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      device: /data/plane-data/pgdata
      o: bind
  redisdata:
    driver: local
    driver_opts:
      type: none
      device: /data/plane-data/redisdata
      o: bind
  uploads:
    driver: local
    driver_opts:
      type: none
      device: /data/plane-data/uploads
      o: bind
  rabbitmq_data:
    driver: local
    driver_opts:
      type: none
      device: /data/plane-data/rabbitmq_data
      o: bind
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_db:
  onlyoffice_fonts:
  onlyoffice_logs:

# 固定内部网段：后端只信任 172.16.0.0/12 来的代理头（TRUSTED_PROXY_CIDRS），
# 让 Docker 自动分配万一分到 192.168.x，会把所有人都判成小网
networks:
  default:
    ipam:
      config:
        - subnet: ${PLANE_NETWORK_SUBNET:-172.29.0.0/24}
